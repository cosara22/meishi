<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>すぎはらじん | デジタル名刺</title>
<style>
  :root {
    --main-bg: #ffffff;
    --accent: #6c9bd1;
    --accent-light: #eaf2fb;
    --text-main: #333333;
    --text-sub: #777777;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #f5f9fc 0%, #ffffff 40%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px 60px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--main-bg);
    border-radius: 24px;
    box-shadow: 0 8px 30px rgba(108, 155, 209, 0.15);
    padding: 32px 24px;
    animation: fadeUp 0.6s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 96px;
    height: 96px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    box-shadow: 0 4px 12px rgba(108, 155, 209, 0.2);
  }
  .name {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .title {
    text-align: center;
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
    margin-top: 6px;
  }
  .message {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    margin: 18px 0 24px;
    line-height: 1.7;
    padding: 14px 16px;
    background: var(--accent-light);
    border-radius: 16px;
  }
  .section {
    margin-top: 22px;
  }
  .section-title {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    background: var(--accent-light);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .link-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .link-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fafcff;
    border: 1px solid #eef3fa;
    border-radius: 14px;
    padding: 12px 14px;
    text-decoration: none;
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .link-item:active {
    transform: scale(0.97);
  }
  .link-icon {
    font-size: 18px;
  }
  .contact-box {
    margin-top: 24px;
    text-align: center;
    padding: 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent-light), #ffffff);
    font-size: 13px;
    color: var(--text-sub);
  }
  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 11px;
    color: #bbbbbb;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">💊</div>
    <div class="name">すぎはらじん</div>
    <div class="title">薬剤師 / エンジニア</div>
    <div class="message">AIでものづくりを楽しんでいます ✨</div>

    <div class="section">
      <div class="section-title">好きな技術・ツール</div>
      <div class="tag-list">
        <span class="tag">🤖 Claude Code</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">趣味</div>
      <div class="tag-list">
        <span class="tag">🧠 AI</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">SNS・リンク</div>
      <div class="link-list">
        <a class="link-item" href="https://x.com/cosara22" target="_blank" rel="noopener">
          <span class="link-icon">🐦</span> X (@cosara22)
        </a>
        <a class="link-item" href="https://github.com/cosara22" target="_blank" rel="noopener">
          <span class="link-icon">🐙</span> GitHub (cosara22)
        </a>
      </div>
    </div>

    <div class="contact-box">
      📩 お問い合わせは SNS の DM までお願いします
    </div>

    <div class="footer">© すぎはらじん</div>
  </div>
</body>
</html>
